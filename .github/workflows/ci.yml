name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  offline:
    name: Offline contributor path / standard library
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Read synthetic status without optional packages
        run: |
          python -S bridge.py --demo --snapshot > "$RUNNER_TEMP/preview.json"
          python -S - "$RUNNER_TEMP/preview.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          status = json.loads(Path(sys.argv[1]).read_text())
          assert status["demo"] is True and status["source"] == "demo"
          assert status["connected"] is False and status["deviceConnected"] is False
          assert status["threads"] and status["projects"]
          PY
      - run: python -S -m unittest discover -s tests -p test_bridge.py -v
      - run: python -S -m unittest discover -s tests -p test_demo.py -k DemoCLITests -v

  bridge:
    name: Bridge / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-device.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q *.py integrations simulator tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --check web/app.js
      - run: node --check simulator/web/app.js
      - run: node --check integrations/t3-current-session.js
      - run: node --check integrations/t3-voice-context.js
      - run: node --test tests/t3_current_session_test.cjs
      - name: Check native touch gestures
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/main tests/tap_test.c firmware/main/tap.c -o /tmp/tap-test
          /tmp/tap-test
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/main tests/gesture_test.c firmware/main/gesture.c -o /tmp/gesture-test
          /tmp/gesture-test
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/main tests/idle_test.c firmware/main/idle.c firmware/main/gesture.c firmware/main/tap.c -o /tmp/idle-test
          /tmp/idle-test
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/main tests/input_test.c firmware/main/input.c firmware/main/gesture.c firmware/main/idle.c firmware/main/tap.c -o /tmp/input-test
          /tmp/input-test
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/main tests/frame_rle_test.c firmware/main/frame_rle.c -o /tmp/frame-rle-test
          /tmp/frame-rle-test
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/main tests/voice_ring_test.c firmware/main/voice_ring.c -lm -o /tmp/voice-ring-test
          /tmp/voice-ring-test
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/main tests/mic_buffer_test.c firmware/main/mic_buffer.c -o /tmp/mic-buffer-test
          /tmp/mic-buffer-test
      - run: git diff --check

  browser:
    name: Display / Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-device.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - run: python tests/browser_voice_smoke.py
      - run: python tests/browser_demo_smoke.py
      - run: python tests/browser_characters_smoke.py
      - run: python tests/browser_simulator_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: display-browser-results
          path: artifacts/browser/
          retention-days: 7
          if-no-files-found: ignore

  speech:
    name: Speech / local Piper and Whisper
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-speech.txt
            requirements-listen.txt
      - run: python -m pip install -r requirements-speech.txt -r requirements-listen.txt
      - name: Download the default voice (hashes verified by the smoke check)
        run: python -m piper.download_voices --download-dir "$RUNNER_TEMP/voices" en_US-lessac-medium
      - run: python tests/speech_smoke.py --voice "$RUNNER_TEMP/voices/en_US-lessac-medium.onnx"
      - run: python setup_stt.py --destination "$RUNNER_TEMP/whisper"
      - run: python tests/listen_smoke.py --voice "$RUNNER_TEMP/voices/en_US-lessac-medium.onnx" --model "$RUNNER_TEMP/whisper"

  firmware:
    name: Firmware / ESP32-S3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash firmware/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shark-display-esp32s3
          path: firmware/build/release/
          retention-days: 14
          if-no-files-found: error

  package:
    name: Package companion
    needs: [offline, bridge, browser, speech, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shark-display-esp32s3
          path: dist/firmware
      - name: Package tracked source only
        run: |
          mkdir -p dist
          git archive --format=tar --prefix=shark-harness/ HEAD | gzip > dist/shark-harness.tar.gz
          cd dist
          tar -czf shark-display-esp32s3.tar.gz -C firmware .
          rm -r firmware
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shark-harness-release
          path: dist/
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shark-harness-release
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
